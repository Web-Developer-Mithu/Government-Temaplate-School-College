<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 520" width="100%" height="100%">
  <defs>
    <linearGradient id="admGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f0fdf4"/>
    </linearGradient>
    <filter id="admShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect x="15" y="15" width="370" height="490" rx="8" fill="url(#admGrad)" stroke="#bbf7d0" stroke-width="1.5" filter="url(#admShadow)"/>
  <path d="M 15 23 Q 15 15 23 15 L 377 15 Q 385 15 385 23 L 385 28 L 15 28 Z" fill="#16a34a"/>

  <!-- Crest -->
  <circle cx="200" cy="70" r="26" fill="#ecfdf5" stroke="#16a34a" stroke-width="1.5"/>
  <text x="200" y="76" font-size="20" text-anchor="middle">🎓</text>

  <text x="200" y="112" font-family="'Hind Siliguri', sans-serif" font-size="13" font-weight="bold" fill="#0f172a" text-anchor="middle">ভর্তি শাখা ও একাডেমিক কাউন্সিল</text>
  <text x="200" y="130" font-family="'Hind Siliguri', sans-serif" font-size="15" font-weight="800" fill="#15803d" text-anchor="middle">সরকারি আদর্শ মডেল কলেজ</text>

  <line x1="40" y1="145" x2="360" y2="145" stroke="#86efac" stroke-width="1.5"/>

  <!-- Alert Banner -->
  <rect x="40" y="165" width="320" height="44" rx="6" fill="#fef2f2" stroke="#f87171" stroke-width="1"/>
  <text x="200" y="192" font-family="'Hind Siliguri', sans-serif" font-size="13" font-weight="bold" fill="#b91c1c" text-anchor="middle">জরুরি বিজ্ঞপ্তি : এসএসসি মূল মার্কশীট জমা</text>

  <!-- Requirements Check-list -->
  <g transform="translate(50, 235)">
    <circle cx="10" cy="10" r="8" fill="#16a34a"/>
    <text x="10" y="13" font-size="9" fill="#ffffff" text-anchor="middle">✓</text>
    <text x="28" y="14" font-family="'Hind Siliguri', sans-serif" font-size="12" font-weight="600" fill="#1e293b">এসএসসি পাসের মূল ট্রান্সক্রিপ্ট / মার্কশীট</text>
  </g>

  <g transform="translate(50, 275)">
    <circle cx="10" cy="10" r="8" fill="#16a34a"/>
    <text x="10" y="13" font-size="9" fill="#ffffff" text-anchor="middle">✓</text>
    <text x="28" y="14" font-family="'Hind Siliguri', sans-serif" font-size="12" font-weight="600" fill="#1e293b">পাসপোর্ট সাইজের রঙিন ছবি (২ কপি)</text>
  </g>

  <g transform="translate(50, 315)">
    <circle cx="10" cy="10" r="8" fill="#16a34a"/>
    <text x="10" y="13" font-size="9" fill="#ffffff" text-anchor="middle">✓</text>
    <text x="28" y="14" font-family="'Hind Siliguri', sans-serif" font-size="12" font-weight="600" fill="#1e293b">ভর্তি ফির সোনালী ব্যাংক অনলাইন রসিদ</text>
  </g>

  <g transform="translate(50, 355)">
    <circle cx="10" cy="10" r="8" fill="#16a34a"/>
    <text x="10" y="13" font-size="9" fill="#ffffff" text-anchor="middle">✓</text>
    <text x="28" y="14" font-family="'Hind Siliguri', sans-serif" font-size="12" font-weight="600" fill="#1e293b">অনলাইন ভেরিফিকেশন স্লিপ</text>
  </g>

  <!-- Deadline Pill -->
  <rect x="75" y="405" width="250" height="32" rx="16" fill="#15803d"/>
  <text x="200" y="426" font-family="'Hind Siliguri', sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">সর্বশেষ সময়: ১৫ নভেম্বর ২০২৬</text>

  <!-- Stamp -->
  <circle cx="310" cy="460" r="22" fill="none" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="3,2"/>
  <text x="310" y="464" font-size="7" font-weight="bold" fill="#16a34a" text-anchor="middle">ADMISSION CELL</text>

  <rect x="25" y="468" width="95" height="22" rx="11" fill="#16a34a"/>
  <text x="72.5" y="483" font-family="sans-serif" font-size="9" font-weight="bold" fill="#ffffff" text-anchor="middle">DOC PREVIEW</text>
</svg>
